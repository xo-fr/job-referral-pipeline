name: Full sweep + match (every 4h)

on:
  schedule:
    - cron: "0 1-23/4 * * *"  # every 4h on the hour at 01,05,09... UTC. The original
                              # job-monitor repo scans the same boards at :30 every
                              # hour; this sits 30 min from all of its runs so the two
                              # never hit LinkedIn/Naukri from GitHub at once.
  workflow_dispatch:
    inputs:
      no_notify:
        description: "Absorb new postings silently (use after widening filters)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full sweep
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional. LinkedIn throttles datacenter IPs, which is what this
          # runner is; set the secret and the jobspy fetcher routes through it.
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}
          # Resume matching (monitor/match.py). Both unset = scan without scores.
          # RESUME_TEXT is the plain-text resume; it never lands in the repo.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          # Optional repo variable to pin a model (default gemini-3.1-flash-lite)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m monitor.main --tier all ${{ inputs.no_notify && '--no-notify' || '' }}
      - name: Commit state
        run: |
          git config user.name "referral-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          # A concurrent scan, or a status write from the dashboard, can land
          # first. Rebasing onto it conflicts inside jobs.json, so instead
          # reconcile the two copies by hand and retry the push.
          for attempt in 1 2 3; do
            git add docs/data/jobs.json
            if git diff --cached --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "scan(all): update jobs.json"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "pushed (attempt $attempt)"; exit 0
            fi
            echo "push rejected - reconciling with the branch (attempt $attempt)"
            git fetch origin "${GITHUB_REF_NAME}"
            git show "origin/${GITHUB_REF_NAME}:docs/data/jobs.json" > /tmp/theirs.json
            python -m monitor.merge docs/data/jobs.json /tmp/theirs.json /tmp/merged.json
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/merged.json docs/data/jobs.json
          done
          echo "still could not push after 3 attempts"; exit 1
